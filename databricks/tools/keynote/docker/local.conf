<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- The Keynote importer passes PostScript names as families; map them to installed faces. -->
  <alias binding="same"><family>Orbitron-Regular</family><prefer><family>Orbitron</family></prefer></alias>
  <alias binding="same"><family>Orbitron-Bold</family><prefer><family>Orbitron</family></prefer></alias>
  <alias binding="same"><family>TitilliumWeb-Regular</family><prefer><family>Titillium Web</family></prefer></alias>
  <alias binding="same"><family>TitilliumWeb-Bold</family><prefer><family>Titillium Web</family></prefer></alias>
  <alias binding="same"><family>TitilliumWeb-Light</family><prefer><family>Titillium Web</family></prefer></alias>
  <alias binding="same"><family>HelveticaNeue</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>HelveticaNeue-Medium</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>HelveticaNeue-Bold</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>HelveticaNeue-Light</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica-Light</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica-Bold</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>ArialMT</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Arial-BoldMT</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Calibri</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Calibri-Bold</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Courier</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>CourierNewPSMT</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>Monaco</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
